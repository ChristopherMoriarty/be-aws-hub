services:
  postgres:
    container_name: aws-hub-postgres
    image: postgres:16
    restart: always
    ports:
      - "${DATABASE__PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE__USER:-aws}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-aws}
      POSTGRES_DB: ${DATABASE__NAME:-aws_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - be-aws-hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER:-aws} -d ${DATABASE__NAME:-aws_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    container_name: aws-hub-migrate
    build:
      context: .
      target: migrate
    env_file:
      - .env
    networks:
      - be-aws-hub-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    container_name: aws-hub-api
    build:
      context: .
      target: api
    restart: always
    env_file:
      - .env
    ports:
      - "${API__PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - be-aws-hub-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  be-aws-hub-network:
    driver: bridge

volumes:
  postgres_data:
    name: aws_hub_postgres
